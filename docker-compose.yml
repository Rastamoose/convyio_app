services:
  workspace:
    build:
      context: .
      # The client bundle bakes these in at build time (see Dockerfile ARGs);
      # compose reads them from the same root .env.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3001:3001"
    env_file: .env
    # Workspace sandboxes and managed Git checkouts live here; the database
    # and uploads remain in Supabase.
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      # node, not curl: the slim base image ships neither curl nor wget.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
